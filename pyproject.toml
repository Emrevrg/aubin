[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aubin"
version = "0.1.0"
description = "AUBIN by Norovox — open-base, calibrated typed-decision models (one forward pass, probabilities out)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["torch", "transformers>=4.57", "accelerate", "peft", "bitsandbytes", "huggingface_hub"]

[project.scripts]
aubin = "aubin.cli:main"

[tool.setuptools]
packages = ["aubin"]
